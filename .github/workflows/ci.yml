name: Django CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: echo "flake8 ."

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        TEST_ENV: true
      run: echo "python manage.py migrate"

    - name: Run tests
      env:
        TEST_ENV: true
      run: echo "python manage.py test"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          docker build -t $DOCKER_USERNAME/myapp:${{ github.sha }} .
          docker tag $DOCKER_USERNAME/myapp:${{ github.sha }} $DOCKER_USERNAME/myapp:latest

      - name: Push Docker image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          docker push $DOCKER_USERNAME/myapp:${{ github.sha }}
          docker push $DOCKER_USERNAME/myapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Copy project files to server
        run: |
          echo "Listing files in GitHub Actions runner before rsync:"
          ls -la
          rsync -avzr -e "ssh -o StrictHostKeyChecking=no" --exclude 'pycache' --exclude '.git' --exclude '.gitignore' --exclude '.env.sample' ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          echo "After rsync, listing contents of ${{ secrets.DEPLOY_DIR }}:"
          ls -la ${{ secrets.DEPLOY_DIR }}
          ls -la ${{ secrets.DEPLOY_DIR }}/config 2>/dev/null || echo "config directory not found"
          EOF

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          echo "Before cd, current directory:"
          pwd
          ls -la
          cd ${{ secrets.DEPLOY_DIR }}
          echo "After cd, current directory:"
          pwd
          ls -la
          python3 -m venv venv || true
          source venv/bin/activate
          pip install --upgrade pip
          echo "Before installing requirements, listing contents:"
          ls -la
          pip install -r requirements.txt || echo "Failed to install requirements"
          EOF

      - name: Deploy to remote server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "${SSH_PRIVATE_KEY}" > private_key.pem
          chmod 600 private_key.pem
          echo "ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'"
          echo "Pulling the latest Docker image..."
          echo "docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:latest || echo "Failed to pull image""
          echo "Stopping and removing existing container..."
          echo "docker stop myapp_container || true"
          echo "docker rm myapp_container || true"
          echo "Running new container..."
          echo "docker run -d --name myapp_container -p 8000:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:latest"
          EOF